[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musavirkit-core"
version = "0.1.0"
description = "e-Fatura / e-Arşiv (UBL-TR) XML dosyalarını Excel'e dönüştüren ve kontrol eden yerel araç"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
musavirkit-core = "musavirkit_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
